<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard AISMUN</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
font-family:'Inter',sans-serif;
background:#eef2f8;
padding:20px;
}

h1{
text-align:center;
color:#0b3d91;
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:12px;
margin-bottom:20px;
}

.card{
background:#fff;
padding:18px;
border-radius:16px;
text-align:center;
box-shadow:0 5px 15px rgba(0,0,0,.08);
}

.card h2{
color:#0b3d91;
font-size:22px;
margin:0;
}

.card p{
font-size:13px;
color:#666;
margin:5px 0 0;
}

table{
width:100%;
border-collapse:collapse;
background:#fff;
border-radius:12px;
overflow:hidden;
}

th,td{
padding:10px;
font-size:13px;
border-bottom:1px solid #eee;
text-align:left;
}

th{
background:#0b3d91;
color:#fff;
}

.btn{
margin:15px 0;
padding:12px;
border:none;
border-radius:10px;
background:#0b3d91;
color:#fff;
font-weight:700;
cursor:pointer;
}
</style>
</head>

<body>

<h1>Dashboard AISMUN</h1>

<!-- 🔥 TARJETAS -->
<div class="cards">
  <div class="card"><h2 id="total">0</h2><p>Total registros</p></div>
  <div class="card"><h2 id="vehiculos">0</h2><p>Vehículos</p></div>
  <div class="card"><h2 id="buses">0</h2><p>Buses</p></div>
  <div class="card"><h2 id="alumnos">0</h2><p>Total alumnos</p></div>
</div>

<button class="btn" onclick="cargar()">🔄 Actualizar</button>

<table>
<thead>
<tr>
<th>Nombre</th>
<th>Teléfono</th>
<th>Institución</th>
<th>Vehículo</th>
<th>Bus</th>
<th>Placa</th>
</tr>
</thead>
<tbody id="tabla"></tbody>
</table>

<script>

const URL_SCRIPT="https://script.google.com/macros/s/AKfycby-V1uzBGMZ5fIXwRZpKw7ceyMkZ9EJ-W2nEbv8e4WpQNZLedDR2XE4_V840mfJrzLbyQ/exec";

async function cargar(){

try{

let res = await fetch(URL_SCRIPT);
let data = await res.json();

// 🔥 CONTADORES
let total = 0;
let vehiculos = 0;
let buses = 0;
let alumnos = 0;

let html = "";

data.forEach(p => {

total++;

// Vehículos
if ((p.Vehiculo || "").toUpperCase() === "SI") vehiculos++;

// Buses
if ((p.Bus || "").toUpperCase() === "SI") buses++;

// Alumnos
if (p.CantidadAlumnos) {
alumnos += Number(p.CantidadAlumnos) || 0;
}

// Tabla
html += `
<tr>
<td>${p.Nombre || ""}</td>
<td>${p.Telefono || ""}</td>
<td>${p.Institucion || ""}</td>
<td>${p.Vehiculo || ""}</td>
<td>${p.Bus || ""}</td>
<td>${p.Placa || p.PlacaBus || ""}</td>
</tr>
`;

});

// 🔥 INYECTAR CONTADORES
document.getElementById("total").innerText = total;
document.getElementById("vehiculos").innerText = vehiculos;
document.getElementById("buses").innerText = buses;
document.getElementById("alumnos").innerText = alumnos;

// 🔥 TABLA
document.getElementById("tabla").innerHTML = html;

}catch(err){
console.error("Error cargando datos:", err);
alert("Error al cargar datos del servidor");
}

}

// carga inicial
cargar();

</script>

</body>
</html>
